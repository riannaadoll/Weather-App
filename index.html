<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <!-- Header (Search bar va tugmalar) -->
    <div class="header-actions">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button class="search-btn"><img src="images/search.png" alt="search"></button>
        </div>
        <button class="location-btn" title="Current Location">
            <img src="images/location.png" alt="location">
        </button>
        <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
            <img src="images/moon.png" alt="theme">
        </button>
    </div>

    <div class="error">
        <p>Invalid city name</p>
    </div>

    <!-- Main Dashboard (2 Ustunli) -->
    <div class="weather">
        <!-- Chap Ustun: Hozirgi Ob-havo -->
        <div class="dashboard-left">
            <div class="current-weather">
                <img src="images/rainn.png" class="weather-icon" alt="weather icon">
                <h1 class="temp">22°c</h1>
                <h2 class="city">New York</h2>
            </div>

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="wind">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- O'ng Ustun: Soatlik va Haftalik prognozlar -->
        <div class="dashboard-right">
            <div class="forecast-section">
                <h3>Hourly Forecast</h3>
                <div class="hourly-list">
                    <!-- JS to'ldiradi -->
                </div>
            </div>

            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div class="daily-list">
                    <!-- JS to'ldiradi -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
